<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Synapse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0A0A0F;
            --bg-secondary: #12121A;
            --bg-card: rgba(25, 25, 35, 0.7);
            --text-primary: #FFFFFF;
            --text-secondary: #A0AEC0;
            --accent-blue: #0D8ABC;
            --accent-purple: #7A28CB;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        a { text-decoration: none; color: inherit; }
        
        .navbar {
            padding: 1.5rem 2rem;
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .logo i { color: var(--accent-purple); }
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        
        .admin-container {
            flex: 1;
            padding: 4rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .admin-header { margin-bottom: 3rem; text-align: center; }
        .admin-header h1 { font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 0.5rem; }
        .admin-header p { color: var(--text-secondary); }
        
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .admin-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 2rem;
        }
        .admin-card h3 { font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .admin-card h3 i { color: var(--accent-blue); }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: white;
            font-family: var(--font-body);
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(122, 40, 203, 0.4);
        }
        
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo"><i class="fa-solid fa-lock"></i> Synapse Admin Panel</a>
        <a href="index.html"><button class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Site</button></a>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Platform Administration</h1>
            <p>Manage societies, events, and student registrations</p>
        </div>

        <div class="forms-grid">
            
            <!-- Broadcast Event Form -->
            <div class="admin-card">
                <h3><i class="fa-solid fa-bullhorn"></i> Broadcast Event</h3>
                <form id="event-form">
                    <div class="form-group">
                        <label>Event Description</label>
                        <input type="text" id="event-desc" placeholder="e.g., CodeStorm Hackathon (Apr 5) begins!" required>
                    </div>
                    <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Send Broadcast</button>
                    <p id="event-msg" style="margin-top:10px; font-size:0.8rem; color:#4ade80; display:none;">Event Broadcasted to all students!</p>
                </form>
            </div>

            <!-- Register New Club Form -->
            <div class="admin-card">
                <h3><i class="fa-solid fa-building-columns"></i> Register New Club</h3>
                <form id="club-form">
                    <div class="form-group">
                        <label>Society Name</label>
                        <input type="text" id="club-name" placeholder="e.g., AI Enthusiasts" required>
                    </div>
                    <div class="form-group">
                        <label>President Name</label>
                        <input type="text" id="club-president" placeholder="e.g., John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Core Focus / Category</label>
                        <select id="club-focus">
                            <option>Technology</option>
                            <option>Arts & Culture</option>
                            <option>Sports</option>
                            <option>Academics</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn"><i class="fa-solid fa-plus"></i> Register Society</button>
                    <p id="club-msg" style="margin-top:10px; font-size:0.8rem; color:#4ade80; display:none;">Society officially registered!</p>
                </form>
            </div>

            <!-- Add Student Manually Form (Optional admin tool) -->
            <div class="admin-card" style="grid-column: 1 / -1;">
                <h3><i class="fa-solid fa-user-plus"></i> Manual Student Registration</h3>
                <form id="student-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" id="student-id" placeholder="S106" required>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="student-name" placeholder="Alice Smith" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="student-email" placeholder="alice@college.edu" required>
                    </div>
                    <div class="form-group">
                        <label>Primary Skill</label>
                        <input type="text" id="student-skill" placeholder="C++, Web, Design..." required>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <button type="submit" class="submit-btn"><i class="fa-solid fa-user-check"></i> Save Student Profile to Database</button>
                        <p id="student-msg" style="margin-top:10px; font-size:0.8rem; color:#4ade80; display:none;">Student saved to C++ Backend!</p>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script>
        // Submit Event
        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const desc = document.getElementById('event-desc').value;
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Sending...';
            try {
                await fetch('/api/events', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({description: desc})
                });
                document.getElementById('event-msg').style.display = 'block';
                document.getElementById('event-desc').value = '';
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Broadcast';
                setTimeout(() => { document.getElementById('event-msg').style.display = 'none'; }, 3000);
            } catch(err) { alert('Failed to connect to backend.'); }
        });

        // Submit Club (Simulated for Presentation)
        document.getElementById('club-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Since the C++ backend does not handle full club models yet, simulate success for the UI presentation
            document.getElementById('club-msg').style.display = 'block';
            document.getElementById('club-name').value = '';
            document.getElementById('club-president').value = '';
            setTimeout(() => { document.getElementById('club-msg').style.display = 'none'; }, 3000);
        });

        // Submit Student
        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('student-id').value;
            const name = document.getElementById('student-name').value;
            const email = document.getElementById('student-email').value;
            const skill = document.getElementById('student-skill').value;
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Saving...';
            
            try {
                await fetch('/api/students', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, name, email, skill})
                });
                document.getElementById('student-msg').style.display = 'block';
                document.getElementById('student-id').value = '';
                document.getElementById('student-name').value = '';
                document.getElementById('student-email').value = '';
                document.getElementById('student-skill').value = '';
                btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Save Student Profile to Database';
                setTimeout(() => { document.getElementById('student-msg').style.display = 'none'; }, 3000);
            } catch(err) { alert('Failed to connect to backend.'); }
        });
    </script>
</body>
</html>
