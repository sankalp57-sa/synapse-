<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse | Admin Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #12141d;
            --bg-card: #1c202d;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f111a;
            --border-color: rgba(255,255,255,0.08);
            --gradient-btn: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            --accent-cyan: #00e676;
        }

        body {
            margin: 0;
            padding: 2rem;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 2rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .card-full {
            grid-column: span 2;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .card-header i {
            font-size: 1.5rem;
            color: #3b82f6;
        }

        .card-header h2 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.2rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 1rem;
            background: var(--gradient-btn);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .back-nav {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Outfit';
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }
        .back-nav:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            .card-full {
                grid-column: span 1;
            }
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-nav"><i class="fa-solid fa-arrow-left"></i> Back to Main Site</a>

    <div class="dashboard-container">
        
        <!-- Broadcast Event Card -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-bullhorn" style="color: #38bdf8;"></i>
                <h2>Broadcast Event</h2>
            </div>
            <form id="eventForm">
                <div class="form-group">
                    <label>Event Description</label>
                    <input type="text" class="form-control" id="eventDesc" placeholder="e.g., CodeStorm Hackathon (Apr 5) begins!" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Send Broadcast
                </button>
            </form>
            <div id="eventMsg" style="margin-top: 10px; color: var(--accent-cyan); display: none;"></div>
        </div>

        <!-- Register New Club Card -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-building-columns" style="color: #38bdf8;"></i>
                <h2>Register New Club</h2>
            </div>
            <form id="clubForm">
                <div class="form-group">
                    <label>Society Name</label>
                    <input type="text" class="form-control" id="clubName" placeholder="e.g., AI Enthusiasts" required>
                </div>
                <div class="form-group">
                    <label>President Name</label>
                    <input type="text" class="form-control" id="presidentName" placeholder="e.g., John Doe" required>
                </div>
                <div class="form-group">
                    <label>Core Focus / Category</label>
                    <select class="form-control" id="clubCategory">
                        <option>Technology</option>
                        <option>Arts & Design</option>
                        <option>Literature & Debate</option>
                        <option>Robotics & Hardware</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus"></i> Register Society
                </button>
            </form>
        </div>

        <!-- Manual Student Registration Card -->
        <div class="card card-full">
            <div class="card-header">
                <i class="fa-solid fa-user-plus" style="color: #38bdf8;"></i>
                <h2>Manual Student Registration</h2>
            </div>
            <form id="studentForm">
                <div class="grid-2">
                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" class="form-control" id="studentId" placeholder="S106" required>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="studentName" placeholder="Alice Smith" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" id="studentEmail" placeholder="alice@college.edu" required>
                    </div>
                    <div class="form-group">
                        <label>Primary Skill</label>
                        <input type="text" class="form-control" id="studentSkill" placeholder="C++, Web, Design..." required>
                    </div>
                </div>
                <!-- Simulating a submission button without sending an actual request since this is frontend -->
                <button type="submit" class="btn-submit" style="margin-top: 1.5rem;">
                    <i class="fa-solid fa-user-check"></i> Save Student Profile to Database
                </button>
            </form>
            <div id="studentMsg" style="margin-top: 10px; color: var(--accent-cyan); display: none; text-align: center;"></div>
        </div>

    </div>

    <!-- Logic for forms -->
    <script>
        document.getElementById('eventForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('eventMsg');
            msg.style.display = 'block';
            msg.innerText = "✅ Broadcast sent successfully!";
            setTimeout(() => { msg.style.display = 'none'; e.target.reset(); }, 3000);
        });

        document.getElementById('clubForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Society Registered Successfully! (Mockup)");
            e.target.reset();
        });

        document.getElementById('studentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('studentMsg');
            msg.style.display = 'block';
            msg.innerText = "✅ Student profile saved to database successfully!";
            setTimeout(() => { msg.style.display = 'none'; e.target.reset(); }, 3000);
        });
    </script>
</body>
</html>
