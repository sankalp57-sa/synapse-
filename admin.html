<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse | Admin Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #12141d;
            --bg-card: #1c202d;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f111a;
            --border-color: rgba(255,255,255,0.08);
            --gradient-btn: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            --accent-cyan: #00e676;
        }

        body {
            margin: 0;
            padding: 2rem;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 2rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .card-full {
            grid-column: span 2;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .card-header i {
            font-size: 1.5rem;
            color: #3b82f6;
        }

        .card-header h2 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.2rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 1rem;
            background: var(--gradient-btn);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .back-nav {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Outfit';
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }
        .back-nav:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            .card-full {
                grid-column: span 1;
            }
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-nav"><i class="fa-solid fa-arrow-left"></i> Back to Main Site</a>

    <div class="dashboard-container">
        
        <div class="card card-full" style="text-align: center; background: var(--gradient-btn); border: none;">
            <h1 id="admin-title" style="margin: 0; font-family: 'Outfit';">Admin Dashboard</h1>
            <p id="admin-subtitle" style="margin: 5px 0 0; opacity: 0.9;">Managing Synapse Infrastructure</p>
        </div>

        <!-- Broadcast Event Card -->
        <div class="card" id="card-broadcast">
            <div class="card-header">
                <i class="fa-solid fa-bullhorn" style="color: #38bdf8;"></i>
                <h2>Broadcast Event</h2>
            </div>
            <form id="eventForm">
                <div class="form-group">
                    <label>Event Description</label>
                    <input type="text" class="form-control" id="eventDesc" placeholder="e.g., CodeStorm Hackathon begins!" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Send Broadcast
                </button>
            </form>
            <div id="eventMsg" style="margin-top: 10px; color: var(--accent-cyan); display: none;"></div>
        </div>

        <!-- Register New Club Card (Admin Only) -->
        <div class="card" id="card-register-club">
            <div class="card-header">
                <i class="fa-solid fa-building-columns" style="color: #38bdf8;"></i>
                <h2>Register New Club</h2>
            </div>
            <form id="clubForm">
                <div class="form-group">
                    <label>Society Name</label>
                    <input type="text" class="form-control" id="clubName" placeholder="e.g., AI Enthusiasts" required>
                </div>
                <div class="form-group">
                    <label>President Name</label>
                    <input type="text" class="form-control" id="presidentName" placeholder="e.g., John Doe" required>
                </div>
                <div class="form-group">
                    <label>Core Focus / Category</label>
                    <select class="form-control" id="clubCategory">
                        <option>Technology</option>
                        <option>Arts & Design</option>
                        <option>Literature & Debate</option>
                        <option>Robotics & Hardware</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus"></i> Register Society
                </button>
            </form>
        </div>

        <!-- Manual Student Registration Card -->
        </div>

        <!-- Pending Applications Card -->
        <div class="card card-full" id="card-applications">
            <div class="card-header">
                <i class="fa-solid fa-list-check" style="color: #38bdf8;"></i>
                <h2>Pending Club Applications</h2>
            </div>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                    <thead>
                        <tr style="text-align: left; color: var(--text-secondary); border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 1rem;">Student</th>
                            <th style="padding: 1rem;">Merit</th>
                            <th style="padding: 1rem;">Message</th>
                            <th style="padding: 1rem; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applications-list">
                        <!-- Dynamic Applications -->
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                                <i class="fa-solid fa-spinner fa-spin"></i> Loading pending requests...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Active Members Management Card -->
        <div class="card card-full" id="card-members">
            <div class="card-header" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-users-gear" style="color: #38bdf8;"></i>
                    <h2>Manage Active Members</h2>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="addMemberId" placeholder="Enter Student ID" class="form-control" style="width: auto; padding: 0.5rem; background: rgba(0,0,0,0.3);">
                    <button onclick="forceAddMember()" class="btn-submit" style="padding: 0.5rem 1rem; width: auto; font-size: 0.9rem;">Add Member</button>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
                    <thead>
                        <tr style="text-align: left; color: var(--text-secondary); border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 1rem;">Student</th>
                            <th style="padding: 1rem;">Skill</th>
                            <th style="padding: 1rem;">Merit Points</th>
                            <th style="padding: 1rem; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="members-list">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                                <i class="fa-solid fa-spinner fa-spin"></i> Loading active members...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Check Role on Load
        const role = localStorage.getItem('synapse_role');
        const club = localStorage.getItem('synapse_club');

        if (!role || (role !== 'admin' && role !== 'president')) {
            window.location.href = 'index.html';
        }

        if (role === 'president') {
            document.getElementById('admin-title').innerText = `${club} President Dashboard`;
            document.getElementById('admin-subtitle').innerText = `Managing ${club} Society Applications & Roster`;
            document.getElementById('card-register-club').style.display = 'none';
            loadApplications(club);
            loadMembers(club);
        }

        async function loadMembers(clubName) {
            const list = document.getElementById('members-list');
            try {
                const res = await fetch(`/api/admin/members/${encodeURIComponent(clubName)}`);
                const mems = await res.json();
                
                if (mems.length === 0) {
                    list.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:2rem; color:var(--text-secondary);">No active members found.</td></tr>';
                    return;
                }

                list.innerHTML = mems.map(m => `
                    <tr style="border-bottom: 1px solid var(--border-color);">
                        <td style="padding: 1rem;">
                            <div style="font-weight:600;">${m.name}</div>
                            <div style="font-size:0.85rem; color:var(--text-secondary);">${m.id}</div>
                        </td>
                        <td style="padding: 1rem;">
                            ${m.skill}<br>
                            <span style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase;">${m.domain !== 'none' ? m.domain : 'N/A'}</span>
                        </td>
                        <td style="padding: 1rem;">
                            <span style="background:rgba(59,130,246,0.2); color:#60a5fa; padding:4px 8px; border-radius:4px; font-weight:600;">${m.points}</span>
                        </td>
                        <td style="padding: 1rem; text-align:center;">
                            <button onclick="processApp('${m.id}', 'none')" style="background:#dc2626; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;" title="Remove from Society"><i class="fa-solid fa-user-minus"></i> Remove</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        window.forceAddMember = async function() {
            const id = document.getElementById('addMemberId').value.trim();
            if(!id) return;
            if(!confirm(`Force add student ID: ${id} to ${club}?`)) return;
            try {
                const res = await fetch('/api/admin/student/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status: 'approved', club })
                });
                if (res.ok) {
                    document.getElementById('addMemberId').value = '';
                    loadMembers(club);
                    alert(`Student ${id} officially added!`);
                } else {
                    alert("Student ID not found in global directory!");
                }
            } catch (e) { console.error(e); }
        };

        async function loadApplications(clubName) {
            const list = document.getElementById('applications-list');
            try {
                const res = await fetch(`/api/admin/applications/${encodeURIComponent(clubName)}`);
                const apps = await res.json();
                
                if (apps.length === 0) {
                    list.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:2rem; color:var(--text-secondary);">No pending applications for this society.</td></tr>';
                    return;
                }

                list.innerHTML = apps.map(app => `
                    <tr style="border-bottom: 1px solid var(--border-color);">
                        <td style="padding: 1rem;">
                            <div style="font-weight:600;">${app.name}</div>
                            <div style="font-size:0.85rem; color:var(--text-secondary);">${app.id}</div>
                            <div style="font-size:0.75rem; margin-top:4px;"><span style="background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">${app.domain !== 'none' ? app.domain : 'N/A'}</span></div>
                        </td>
                        <td style="padding: 1rem;">
                            <span style="background:rgba(59,130,246,0.2); color:#60a5fa; padding:4px 8px; border-radius:4px; font-weight:600;">${app.points}</span>
                        </td>
                        <td style="padding: 1rem; font-size:0.9rem; max-width:250px; overflow:hidden; text-overflow:ellipsis;">
                            ${app.message || '<i style="opacity:0.5;">No message provided</i>'}
                        </td>
                        <td style="padding: 1rem; text-align:center;">
                            <button onclick="processApp('${app.id}', 'approved')" style="background:#059669; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; margin-right:5px;"><i class="fa-solid fa-check"></i></button>
                            <button onclick="processApp('${app.id}', 'rejected')" style="background:#dc2626; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        window.processApp = async function(id, status) {
            if(!confirm(`Are you sure you want to mark ${id} as ${status}?`)) return;
            try {
                // We'll reuse the update endpoint or create a simple one
                const res = await fetch('/api/admin/student/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status, club })
                });
                if (res.ok) {
                    alert(`${id} has been ${status}!`);
                    loadApplications(club);
                    loadMembers(club);
                }
            } catch (e) { console.error(e); }
        };

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('eventMsg');
            const desc = document.getElementById('eventDesc').value;
            
            try {
                const response = await fetch('/api/admin/event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: desc, club: club || 'System' })
                });
                
                if (response.ok) {
                    msg.style.display = 'block';
                    msg.innerText = "✅ Broadcast sent successfully!";
                    setTimeout(() => { msg.style.display = 'none'; e.target.reset(); }, 3000);
                }
            } catch (err) { console.error(err); }
        });

        // Delete unused clubForm and manual student registration listeners if they are not needed by the President
    </script>
</body>
</html>
